name: Auto Price Scraper

on:
  schedule:
    # 協定世界時(UTC)で指定
    - cron: '0 21,9 * * *'
  workflow_dispatch: # 手動

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      
    steps:
    - name: チェックアウト
      uses: actions/checkout@v4

    - name: Pythonの準備
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 必要なライブラリを入れる
      run: |
        pip install beautifulsoup4 pytz cloudscraper

    - name: スクレイピング実行
      run: python scrape.py

    - name: 更新されたデータをGitHubに保存（コミット）
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        # 変更があったときだけプッシュ
        git diff --cached --quiet || (git commit -m "最新の相場に更新しました" && git push)
