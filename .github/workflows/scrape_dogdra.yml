name: Dogdra Price Scraper
on:
  workflow_dispatch:
jobs:
  scrape-dogdra:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
    - name: チェックアウト
      uses: actions/checkout@v4
    - name: Pythonの準備
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 必要なライブラリを入れる
      run: pip install requests beautifulsoup4 pytz
    - name: ドグドラスクレイピング実行
      env:
        SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      run: python scrape_dogdra.py
    - name: 更新されたデータをGitHubに保存（コミット）
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git diff --cached --quiet || (git commit -m "Updated dogdra prices" && git push)
